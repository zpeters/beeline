[package]
name = "beeline"
version = "0.2.0"
edition = "2024"
description = "A minimal desktop API client. Collections are plain folders of JSON files."
license = "GPL-3.0-or-later"
repository = "https://github.com/zpeters/beeline"
readme = "README.md"
keywords = ["api", "http", "rest", "client", "gui"]
categories = ["development-tools", "gui"]

[package.metadata.bundle]
name = "beeline"
identifier = "com.zachpeters.beeline"
icon = [
    "assets/icon/32x32.png",
    "assets/icon/32x32@2x.png",
    "assets/icon/128x128.png",
    "assets/icon/256x256.png",
    "assets/icon/512x512.png",
    "assets/icon/512x512@2x.png",
]
category = "public.app-category.developer-tools"
short_description = "A minimal API client"

[dependencies]
base64 = "0.23.1"
iced = { version = "0.14.0", features = ["advanced", "canvas"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
shell-words = "1.1.1"
trash = "5.2.9"
ureq = "3.4.2"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Only the macOS menu bar; its default `gtk3` feature is the Linux backend.
muda = { version = "0.21.2", default-features = false }
