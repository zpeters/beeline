[package]
name = "beeline"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.37.0", features = ["persistence"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
trash = "5.2.9"
ureq = "3.4.2"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
