      <g fill="#d3d9de" stroke="#30373e" stroke-width="1.2"><circle cx="80" cy="75.5" r="3.6"/><circle cx="14" cy="75.5" r="3.6"/></g>
      <path d="M7 33 H28 V44 H8 Z" fill="url(#v2steel)"/>
      <rect x="6" y="32" width="23" height="2" rx="1" fill="#59626b"/>
      <rect x="10.5" y="36" width="6" height="5" rx="1" fill="#1b2633"/><rect x="19" y="36" width="6" height="5" rx="1" fill="#1b2633"/>
      <path d="M8 44 H60 Q88 44 93 62 Q92 68 86 68 H8 Z" fill="url(#v2steel)"/>
      <g clip-path="url(#v2body)" stroke-width=".55">
        <line x1="8" y1="49" x2="100" y2="49" stroke="#fff"/><line x1="8" y1="49.8" x2="100" y2="49.8" stroke="#6c7680"/>
        <line x1="8" y1="51.6" x2="100" y2="51.6" stroke="#fff"/><line x1="8" y1="52.4" x2="100" y2="52.4" stroke="#6c7680"/>
      </g>
      <path d="M58 44.3 Q84 45 91.5 58" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M58 45.6 Q83 46.5 90.6 59" stroke="#7d8790" stroke-width=".6" fill="none"/>
      <circle cx="91" cy="57.5" r="1.7" fill="#fff4c2"/>
      <path d="M8 62 H90.5 Q89.5 66.5 86 68 H8 Z" fill="url(#v2dark)"/>
      <rect x="66" y="65" width="11" height="6" rx="2" fill="url(#v2dark)" stroke="#30373e" stroke-width=".6"/>
      <g stroke="#262c32" stroke-width="1.8" stroke-linecap="round"><line x1="30" y1="74.5" x2="61" y2="74.5"/><line x1="61" y1="74.5" x2="70" y2="68.5"/></g>
      <circle cx="42" cy="56.5" r="7" fill="#1d2a44" stroke="#d9a83a" stroke-width="1.4"/>
      <use href="#v2bee" transform="translate(42 57) scale(1.05)"/>
    </g>

    <g id="v2rays">
