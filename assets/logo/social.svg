      <path d="M-.4 -2.4 C-3 -5.4 -6.6 -4.6 -6.2 -2.4 C-5.8 -.6 -2.6 -.6 -.4 -1.6 Z" fill="#f6e7b9"/>
      <path d="M.4 -2.4 C3 -5.4 6.6 -4.6 6.2 -2.4 C5.8 -.6 2.6 -.6 .4 -1.6 Z" fill="#f6e7b9"/>
      <circle cx="0" cy="-3.7" r="1.35" fill="#d9a83a"/>
      <path d="M0 -2.3 C2.5 -2.3 2.7 1.6 0 5.4 C-2.7 1.6 -2.5 -2.3 0 -2.3 Z" fill="#d9a83a"/>
      <g stroke="#1d2a44" stroke-width=".75"><line x1="-2.3" y1="0" x2="2.3" y2="0"/><line x1="-1.8" y1="2.2" x2="1.8" y2="2.2"/></g>
    </g>

    <g id="f-badge">
      <circle r="30" fill="#1d2a44" stroke="#d9a83a" stroke-width="4"/>
      <circle r="24.5" fill="none" stroke="#d9a83a" stroke-width=".9" opacity=".7"/>
      <use href="#f-bee" transform="translate(0 .8) scale(3.3)"/>
    </g>

    <symbol id="f-icon-steel" viewBox="0 0 100 100">
      <rect x="4" y="4" width="92" height="92" rx="21" fill="url(#v2steel)"/>
      <g clip-path="url(#f-sq)" stroke-width=".8">
        <line x1="0" y1="14" x2="100" y2="14" stroke="#fff"/><line x1="0" y1="15.2" x2="100" y2="15.2" stroke="#6c7680"/>
        <line x1="0" y1="85" x2="100" y2="85" stroke="#fff"/><line x1="0" y1="86.2" x2="100" y2="86.2" stroke="#6c7680"/>
      </g>
      <use href="#f-badge" transform="translate(50 50) scale(1.15)"/>
    </symbol>

    <symbol id="f-icon-navy" viewBox="0 0 100 100">
      <rect x="4" y="4" width="92" height="92" rx="21" fill="#1a2540"/>
      <g clip-path="url(#f-sq)"><use href="#v2rays" transform="translate(50 50)" fill="#d9a83a" opacity=".1"/></g>
      <use href="#f-badge" transform="translate(50 50) scale(1.15)"/>
    </symbol>

    <symbol id="f-banner" viewBox="0 0 300 100">
      <rect width="300" height="100" rx="14" fill="#1a2540"/>
      <g clip-path="url(#f-wide)">
        <use href="#v2rays" transform="translate(96 54) scale(1.6)" fill="#d9a83a" opacity=".1"/>
        <g transform="translate(8 2) scale(.95)"><use href="#v2train"/></g>
        <rect x="0" y="78" width="300" height="2.4" fill="#d9a83a"/>
        <rect x="0" y="82" width="300" height=".8" fill="#d9a83a" opacity=".5"/>
        <text x="112" y="56" font-family="Futura, 'Futura PT', 'Josefin Sans', sans-serif" font-weight="500" font-size="36" letter-spacing="1.5" fill="#f1f4f6">beeline</text>
        <text x="113.5" y="70" font-family="Futura, 'Futura PT', 'Josefin Sans', sans-serif" font-size="6.4" letter-spacing="1.9" fill="#d9a83a">A MINIMAL DESKTOP API CLIENT</text>
      </g>
    </symbol>
</defs>
<rect width="300" height="150" fill="#1a2540"/>
<use href="#v2rays" transform="translate(101 79) scale(1.8)" fill="#d9a83a" opacity=".1"/>
<rect x="0" y="100.2" width="300" height="2.2" fill="#d9a83a"/>
<rect x="0" y="103.8" width="300" height=".7" fill="#d9a83a" opacity=".5"/>
<g transform="translate(15 30) scale(.9)">
  <g transform="translate(8 2) scale(.95)"><use href="#v2train"/></g>
  <text x="112" y="56" font-family="Futura, 'Futura PT', 'Josefin Sans', sans-serif" font-weight="500" font-size="36" letter-spacing="1.5" fill="#f1f4f6">beeline</text>
  <text x="113.5" y="70" font-family="Futura, 'Futura PT', 'Josefin Sans', sans-serif" font-size="6.4" letter-spacing="1.9" fill="#d9a83a">A MINIMAL DESKTOP API CLIENT</text>
</g>
<text x="150" y="128" text-anchor="middle" font-family="Futura, 'Futura PT', 'Josefin Sans', sans-serif" font-size="6" letter-spacing="1.2" fill="#9aa4ad">github.com/zpeters/beeline</text>
</svg>
