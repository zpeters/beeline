        <g fill="#d9a83a" opacity=".5"><rect x="0" y="84" width="100" height=".8"/></g>
      </g>
    </symbol>

    <symbol id="v2b" viewBox="0 0 100 100">
      <rect x="4" y="4" width="92" height="92" rx="21" fill="#151a26"/>
