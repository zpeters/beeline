        <g stroke="#d9a83a" stroke-width="2.2" stroke-linecap="round"><line x1="40" y1="80" x2="26" y2="100"/><line x1="60" y1="80" x2="74" y2="100"/></g>
        <path d="M22 80 V52 Q22 22 50 20 Q78 22 78 52 V80 Z" fill="url(#v2steelH)"/>
        <g clip-path="url(#v2dome)" stroke-width=".6">
