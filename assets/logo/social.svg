          <line x1="59" y1="44" x2="100" y2="44" stroke="#fff"/><line x1="59" y1="44.8" x2="100" y2="44.8" stroke="#6c7680"/>
          <rect x="0" y="70" width="100" height="10" fill="url(#v2dark)"/>
          <g fill="#30373e"><rect x="22" y="72.5" width="56" height="1.2"/><rect x="22" y="75.5" width="56" height="1.2"/></g>
        </g>
        <path d="M46.5 22.5 Q50 19.5 53.5 22.5 V48 H46.5 Z" fill="url(#v2steelH)" stroke="#7d8790" stroke-width=".5"/>
        <circle cx="50" cy="30" r="3.4" fill="#fff4c2" stroke="#59626b" stroke-width=".8"/>
        <circle cx="50" cy="57" r="10" fill="#1d2a44" stroke="#d9a83a" stroke-width="1.8"/>
        <use href="#v2bee" transform="translate(50 57.5) scale(1.55)"/>
      </g>
    </symbol>

    <symbol id="v2c" viewBox="0 0 100 100">
      <rect x="4" y="4" width="92" height="92" rx="21" fill="#f1e7cf"/>
      <g clip-path="url(#v2sq)">
        <g fill="#d9a83a" opacity=".55">
          <rect x="-10" y="26" width="46" height="1.6" transform="rotate(-14 50 50)"/>
          <rect x="-10" y="31" width="34" height="1.6" transform="rotate(-14 50 50)"/>
          <rect x="-10" y="36" width="40" height="1.6" transform="rotate(-14 50 50)"/>
        </g>
        <g transform="rotate(-14 50 56) translate(2 -2)">
          <use href="#v2train"/>
          <rect x="-20" y="80" width="140" height="2.6" fill="#1a2540"/>
        </g>
      </g>
    </symbol>
  
    <clipPath id="f-sq"><rect x="4" y="4" width="92" height="92" rx="21"/></clipPath>
    <clipPath id="f-wide"><rect x="0" y="0" width="300" height="100" rx="14"/></clipPath>

    <!-- the bee, refined for large sizes; centred on 0,0, about 12 units tall -->
    <g id="f-bee">
