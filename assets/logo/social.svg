<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 300 150">
<!-- GitHub social preview (Settings > Social preview). Rendered by: just icons -->
<defs>
    <linearGradient id="v2steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfeff"/><stop offset=".3" stop-color="#c0c8cf"/><stop offset=".52" stop-color="#f1f4f6"/><stop offset=".8" stop-color="#9aa4ad"/><stop offset="1" stop-color="#6c7680"/>
    </linearGradient>
    <linearGradient id="v2steelH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6c7680"/><stop offset=".28" stop-color="#eef1f4"/><stop offset=".45" stop-color="#b9c1c9"/><stop offset=".68" stop-color="#fbfcfd"/><stop offset="1" stop-color="#66707a"/>
    </linearGradient>
    <linearGradient id="v2dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ea7af"/><stop offset="1" stop-color="#4d565f"/>
    </linearGradient>
    <clipPath id="v2sq"><rect x="4" y="4" width="92" height="92" rx="21"/></clipPath>
    <clipPath id="v2body"><path d="M8 44 H60 Q88 44 93 62 Q92 68 86 68 H8 Z"/></clipPath>
    <clipPath id="v2dome"><path d="M22 80 V52 Q22 22 50 20 Q78 22 78 52 V80 Z"/></clipPath>

    <g id="v2bee">
      <ellipse cx="-2.6" cy="-1.6" rx="2.4" ry="1.4" transform="rotate(-30 -2.6 -1.6)" fill="#f6e7b9"/>
      <ellipse cx="2.6" cy="-1.6" rx="2.4" ry="1.4" transform="rotate(30 2.6 -1.6)" fill="#f6e7b9"/>
      <circle cx="0" cy="-3.6" r="1.3" fill="#d9a83a"/>
      <ellipse cx="0" cy="0.6" rx="2.2" ry="3.4" fill="#d9a83a"/>
      <g stroke="#1d2a44" stroke-width=".7"><line x1="-2.3" y1="0" x2="2.3" y2="0"/><line x1="-2" y1="2" x2="2" y2="2"/></g>
    </g>

    <g id="v2wheel">
