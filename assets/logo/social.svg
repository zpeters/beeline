      <g stroke="#59626b" stroke-width=".7"><line x1="-6.5" y1="0" x2="6.5" y2="0"/><line x1="0" y1="-6.5" x2="0" y2="6.5"/><line x1="-4.6" y1="-4.6" x2="4.6" y2="4.6"/><line x1="-4.6" y1="4.6" x2="4.6" y2="-4.6"/></g>
      <circle r="2" fill="#30373e"/>
    </g>

